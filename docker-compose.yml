services:
  redops-forge:
    build: .
    container_name: redops-forge
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      REDOPS_DB_PATH: /data/redops.db
    volumes:
      - redops-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    networks:
      - redops-net
volumes:
  redops-data:
networks:
  redops-net:
    driver: bridge
